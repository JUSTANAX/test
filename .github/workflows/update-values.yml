name: Обновление цен

# Раз в 6 часов. Сайт правит цены пачками раз в 2-5 дней, поэтому чаще почти
# бессмысленно - но при суточном расписании мы могли отстать от их публикации
# почти на сутки. Шесть часов ограничивают отставание, оставаясь вежливыми к
# чужому сайту: 4 прогона в день вместо 24 при почасовом.
#
# Минутами не 00: GitHub в начале часа перегружен и задерживает запуски.
on:
  schedule:
    - cron: "17 */6 * * *"   # 04:17, 10:17, 16:17, 22:17 UTC
  workflow_dispatch:         # и вручную, когда нужно срочно

  # Правка самого расписания проверяется сразу после пуша, а не через шесть
  # часов вслепую. Фильтр по пути важен: бот коммитит только data/, поэтому
  # его собственные коммиты этот триггер не поднимают и петли не будет.
  push:
    paths:
      - ".github/workflows/**"
      - "parser/**"
      - "requirements.txt"
      - "update.py"

# Нужно, чтобы шаг коммита мог писать в репозиторий.
permissions:
  contents: write

concurrency:
  group: update-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # С запасом: парсер по просьбе архива делает длинные паузы (до 60-240 сек
    # на категорию), и при неудачном стечении обстоятельств прогон растягивается.
    timeout-minutes: 45

    steps:
      # Версии закреплены мажорными тегами: патчи внутри мажора подтягиваются
      # сами, а смена мажора остаётся осознанным решением. На v4 и v5 GitHub
      # ругался, что они держатся на Node 20, который выводят из обращения.
      - name: Забрать репозиторий
        uses: actions/checkout@v7

      - name: Поставить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Поставить браузер для Playwright
        # --with-deps тянет системные библиотеки, без которых Chromium на
        # чистом ubuntu не стартует.
        run: playwright install --with-deps chromium

      - name: Проверка - пускает ли сайт из облака
        # Отдельный шаг ради ясного ответа в логе. Imperva к датацентровым
        # адресам строже, чем к домашним, поэтому то, что работает локально,
        # в облаке может и не пройти. Шаг НЕ валит сборку: если не пустит,
        # update.py откатится на зеркала, и цены всё равно обновятся.
        continue-on-error: true
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://supremevalues.com/mm2/godlies"
          PROBE = """() => ({
            len: document.documentElement.outerHTML.length,
            incapsula: /_Incapsula_Resource|Incapsula/i.test(document.documentElement.outerHTML),
            count: (typeof window._svPopup === 'object' && window._svPopup)
              ? Object.keys(window._svPopup).length : 0,
          })"""

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              pg = b.new_context(viewport={"width": 1440, "height": 900},
                                 locale="en-US").new_page()
              pg.goto(URL, wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_timeout(4000)
              r = pg.evaluate(PROBE)
              b.close()

          print(f"размер страницы : {r['len']}")
          print(f"защита Imperva  : {r['incapsula']}")
          print(f"предметов       : {r['count']}")
          print()
          if r["count"] > 0:
              print("ОБЛАКО ПРОХОДИТ: сайт отдал полную страницу с датацентрового адреса.")
          else:
              print("ОБЛАКО НЕ ПРОХОДИТ: пришла заглушка.")
              print("Цены возьмутся с зеркал - это на шаг менее свежо, но рабочий путь.")
              raise SystemExit(1)
          PY

      - name: Собрать свежие цены
        # update.py берёт цены с зеркал Supreme Values, а при их недоступности
        # откатывается на Wayback. Оба пути при неполном каталоге возвращают 1
        # и НЕ перезаписывают результат: неполный набор опаснее устаревшего,
        # потому что предметы пропавших категорий получили бы цену
        # однофамильцев из чужих категорий.
        run: python update.py

      - name: Проверить, что артефакт не испортился
        # Пояс поверх подтяжек: даже если предыдущий шаг отчитался об успехе,
        # не коммитим файл, который явно сломан или подозрительно похудел.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          p = pathlib.Path("data/mm2_values.json")
          if not p.exists():
              sys.exit("нет data/mm2_values.json")

          d = json.loads(p.read_text(encoding="utf-8"))
          weapons = len(d.get("items", {}).get("Weapons", {}))
          pets = len(d.get("items", {}).get("Pets", {}))
          priced = d.get("stats", {}).get("priced", 0)

          print(f"оружия={weapons} петов={pets} с ценой={priced}")

          if weapons < 900:
              sys.exit(f"оружий всего {weapons}, ожидалось ~960 - каталог неполон")
          if priced < 400:
              sys.exit(f"с ценой всего {priced}, ожидалось ~470 - цены потерялись")
          if not d.get("categoryDates"):
              sys.exit("нет categoryDates - собран старой версией сборщика")
          PY

      - name: Закоммитить, если что-то изменилось
        run: |
          if git diff --quiet -- data/mm2_values.json; then
            echo "Цены не изменились, коммит не нужен."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mm2_values.json
          git commit -m "Свежие цены $(date -u +%Y-%m-%d)"
          git push
